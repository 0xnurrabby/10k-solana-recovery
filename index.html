    <script>
      // Route Privy API requests through local or Vercel proxy with spoofed Origin: https://10k.world
      (function() {
        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
          try {
            const originBase = window.location.origin;
            if (typeof input === 'string') {
              if (input.includes('auth.privy.io')) {
                input = input.replace('https://auth.privy.io', originBase + '/privy-auth');
              }
            } else if (input && typeof input === 'object') {
              const url = input.url || '';
              if (url.includes('auth.privy.io')) {
                const newUrl = url.replace('https://auth.privy.io', originBase + '/privy-auth');
                input = new Request(newUrl, input);
              }
            }
          } catch (e) {
            console.warn('[Privy Proxy] Fetch rewrite error:', e);
          }
          return originalFetch.call(this, input, init);
        };
      })();
    </script>
